/* ================= UI EVENTS ================= */
function bindUI() {
  const click = (el, fn) => el && el.addEventListener('click', ev => { ev.stopPropagation(); Aud.ensure(); Aud.resume(); Aud.ui(); fn(); });
  click(D.btn_play, () => startRun('endless'));
  click(D.btn_missions, () => showScreen('missions'));
  click(D.btn_daily, () => showScreen('daily'));
  click(D.btn_ships, () => showScreen('ships'));
  click(D.btn_ach, () => showScreen('ach'));
  click(D.btn_set, () => showScreen('set'));
  for (const el of document.querySelectorAll('[data-back]')) click(el, () => showScreen(el.getAttribute('data-back')));
  click(D.btn_daily_play, () => startRun('daily'));
  click(D.bst_shield_buy, () => buyBooster('shield'));
  click(D.bst_magnet_buy, () => buyBooster('magnet'));
  click(D.bst_shield_ad, () => adBooster('shield'));
  click(D.bst_magnet_ad, () => adBooster('magnet'));
  click(D.btn_pause, () => doPause('manual'));
  click(D.btn_resume, () => doResume());
  click(D.btn_restart, () => {
    const m = S.run ? S.run.mode : 'endless', mid = S.run ? S.run.missionId : null;
    showScreen('hud');
    startRun(m, { missionId: mid, skipTut: true });
  });
  click(D.btn_pmenu, () => {
    const played = S.playedMs;
    try { Platform.adapter.gameplayStop(); } catch (e) {}
    Aud.engineStop();
    showScreen('menu');
    if (played > CFG.AD_MENU_PLAYED) showInterstitial();
  });
  click(D.btn_cont_ad, () => showRewarded(() => continueRun()));
  click(D.btn_cont_coins, () => {
    if (S.save.coins >= CFG.CONTINUE_COST) { S.save.coins -= CFG.CONTINUE_COST; saveGame(true); continueRun(); }
    else toast(t('not_enough_coins'));
  });
  click(D.btn_double, () => {
    const r = S.run;
    if (!r || r.doubled) return;
    showRewarded(() => {
      r.doubled = true;
      S.save.coins += r.coins;
      saveGame(true);
      D.btn_double.style.display = 'none';
      D.over_coins.textContent = r.coins * 2;
      syncCoinsUI();
      toast('🪙 +' + r.coins);
    });
  });
  click(D.btn_retry, () => {
    const m = S.run ? S.run.mode : 'endless', mid = S.run ? S.run.missionId : null;
    showInterstitial(() => startRun(m, { missionId: mid, skipTut: true }));
  });
  click(D.btn_over_menu, () => {
    const played = S.playedMs;
    S.playedMs = 0;
    showScreen('menu');
    if (played > CFG.AD_MENU_PLAYED) showInterstitial();
  });
  click(D.set_sound, () => { S.save.settings.sound = !S.save.settings.sound; renderSettings(); saveGame(true); if (S.save.settings.sound) { Aud.ensure(); Aud.resume(); } });
  click(D.set_music, () => { S.save.settings.music = !S.save.settings.music; renderSettings(); saveGame(true); });
  click(D.lang_ru, () => switchLang('ru'));
  click(D.lang_en, () => switchLang('en'));
  D.quests_box && D.quests_box.addEventListener('click', ev => {
    const qi = ev.target && ev.target.getAttribute && ev.target.getAttribute('data-qi');
    if (qi !== null && qi !== undefined && qi !== '') {
      const q = S.save.quests.list[+qi];
      if (q && !q.claimed && q.prog >= q.target) {
        q.claimed = true;
        S.save.coins += q.reward;
        Aud.win();
        toast('+' + q.reward, 'coin');
        if (S.save.quests.list.every(x => x.claimed)) questStreakBump();
        saveGame(true);
        renderQuests();
        syncCoinsUI();
      }
      return;
    }
    if (ev.target && ev.target.id === 'chest-btn') {
      const ch = chestNext();
      if (!ch) return;
      showRewarded(() => {
        S.save.questStreak.chests.push(ch);
        S.save.coins += CFG.CHEST_REWARD[ch];
        Aud.win();
        toast(t('chest_reward', { n: CFG.CHEST_REWARD[ch] }), 'chest');
        saveGame(true);
        renderQuests();
        syncCoinsUI();
      });
    }
  });
  click(D.sd_back, () => closeShipDetail());
  click(D.sd_ad, () => {
    const ship = shipById(S.shipView);
    if (!ship || isShipAvailable(ship.id)) return;
    if (ship.adShip) {
      const need = ship.adNeed || 3;
      showRewarded(() => {
        const n = (S.save.ad_progress[ship.id] || 0) + 1;
        S.save.ad_progress[ship.id] = n;
        if (n >= need) {
          S.save.ships_unlocked.push(ship.id);
          checkAchievements();
          Aud.win();
          toast(t(ship.nameKey) + '!', 'star');
        } else {
          toast(t('ad_ship_btn', { n, m: need }), 'od');
        }
        saveGame(true);
        openShipDetail(ship.id);
        renderShips();
        syncCoinsUI();
      });
    }
  });
  click(D.sd_equip, () => {
    const id = S.shipView;
    if (!id || !isShipAvailable(id)) return;
    S.save.ship_equipped = id;
    saveGame(true);
    closeShipDetail();
    renderShips();
  });
  click(D.sd_buy, () => {
    const ship = shipById(S.shipView);
    if (!ship || isShipAvailable(ship.id)) return;
    if (ship.adShip) {
      const cost = ship.fallbackCost || 0;
      if (S.save.coins >= cost) {
        S.save.coins -= cost;
        S.save.ships_unlocked.push(ship.id);
        S.save.ship_equipped = ship.id;
        checkAchievements(); saveGame(true); Aud.win();
        toast(t(ship.nameKey) + '!', 'star');
        closeShipDetail(); renderShips();
      } else toast(t('not_enough_coins'));
      return;
    }
    if (ship.reqShips && S.save.ships_unlocked.length < ship.reqShips) { toast(S.save.ships_unlocked.length + '/' + ship.reqShips, 'lock'); return; }
    if (ship.ach && S.save.achievements.indexOf(ship.ach) === -1) { toast(t('locked_ach', { name: t(ship.ach) }), 'lock'); return; }
    if (S.save.coins >= ship.cost) {
      S.save.coins -= ship.cost;
      S.save.ships_unlocked.push(ship.id);
      S.save.ship_equipped = ship.id;
      checkAchievements(); saveGame(true); Aud.win();
      toast(t(ship.nameKey), 'star');
      closeShipDetail();
      renderShips();
    } else toast(t('not_enough_coins'));
  });
  click(D.ad_dlg_ok, () => D.ad_dlg.classList.remove('active'));
  click(D.ad_dlg_sim, () => {
    try {
      const u = new URL(location.href);
      u.searchParams.set('adsmock', '1');
      location.href = u.toString();
    } catch (e) {}
  });
  click(D.ad_dlg_coins, () => {
    const ship = shipById(S.shipView);
    D.ad_dlg.classList.remove('active');
    if (!ship || !ship.fallbackCost || S.save.coins < ship.fallbackCost) return;
    S.save.coins -= ship.fallbackCost;
    S.save.ships_unlocked.push(ship.id);
    S.save.ship_equipped = ship.id;
    checkAchievements(); saveGame(true); Aud.win();
    toast(t(ship.nameKey) + '!', 'star');
    closeShipDetail(); renderShips();
  });
  click(D.btn_tut_skip, () => {
    S.tut.active = false;
    S.save.tutorial_done = true;
    D.tut.classList.remove('active');
    saveGame(true);
  });
}
function buyBooster(kind) {
  if (S.boost[kind]) { S.boost[kind] = false; renderBoosters(); return; }
  if (S.save.coins >= CFG.BOOSTER_COST) { S.save.coins -= CFG.BOOSTER_COST; S.boost[kind] = true; saveGame(true); }
  else toast(t('not_enough_coins'));
  renderBoosters(); syncCoinsUI();
}
function adBooster(kind) {
  if (S.boost[kind]) return;
  showRewarded(() => { S.boost[kind] = true; renderBoosters(); toast(t('booster_' + kind), 'star'); });
}

/* ================= BOOT ================= */
function bindPlatformEvents(a) {
  a.on('pause', () => doPause('external'));
  a.on('resume', () => { if (S.pauseSource === 'external') doResume(); else Aud.resume(); });
  a.on('mute', () => { Aud.gpMute = true; Aud.engineSet(0, false); });
  a.on('unmute', () => { Aud.gpMute = false; });
  a.on('mute:music', () => { Aud.gpMusicMute = true; });
  a.on('unmute:music', () => { Aud.gpMusicMute = false; });
}
async function boot() {
  cacheDom();
  buildSprites();
  layout();
  S.save = loadLocal();
  bindInput();
  bindUI();
  const a = await Platform.init();
  S.adapter = a;
  try { S.adsReal = (a.name !== 'local') || new URLSearchParams(location.search).has('adsmock'); } catch (e) { S.adsReal = a.name !== 'local'; }
  bindPlatformEvents(a);
  try {
    const cloud = await Promise.race([
      a.load ? a.load() : Promise.resolve(null),
      new Promise(res => setTimeout(() => res(null), 3500)),
    ]);
    if (cloud && typeof cloud === 'object') {
      S.save = mergeSave(cloud, S.save);
      saveLocal();
      if (a.name === 'gamepush') toast(t('cloud_sync'), 'star');
    }
  } catch (e) { /* local-only */ }
  window.addEventListener('gp-ready', () => {
    if (Platform.adapter === GamePushAdapter) return;
    GamePushAdapter.init().then(() => {
      Platform.adapter = GamePushAdapter;
      S.adapter = GamePushAdapter;
      bindPlatformEvents(GamePushAdapter);
      try { GamePushAdapter.ready(); } catch (e) {}
    }).catch(() => {});
  });
  // return capsule
  try {
    const tk = todayKey();
    if (S.save.lastSeen && S.save.lastSeen !== tk && S.save.lastSeen !== yesterdayKey()) {
      S.save.coins += 100;
      setTimeout(() => toast(t('capsule', { n: 100 }), 'chest'), 800);
    }
    S.save.lastSeen = tk;
    saveGame(false);
  } catch (e) {}
  const pl = (a.getLang && a.getLang()) || 'en';
  setLang(S.save.settings.lang || pl);
  applyLang();
  syncCoinsUI();
  try { a.ready(); } catch (e) {}
  try { if (a.showBanner) a.showBanner(); } catch (e) {}
  if (a === GamePushAdapter) { Aud.gpMute = a.isSoundMuted(); Aud.gpMusicMute = a.isMusicMuted(); }
  D.loading.style.opacity = '0';
  setTimeout(() => { D.loading.style.display = 'none'; }, 420);
  showScreen('menu');
  Aud.musicStart();
  requestAnimationFrame(frame);
  SD.booted = true;
  window.__SD.booted = true;
}

/* ================= QA HOOKS ================= */
window.__SD = {
  version: SD.version,
  booted: false,
  SD, CFG, S,
  getState() {
    const r = S.run;
    return {
      screen: S.screen, lang: getLang(), adapter: Platform.adapter ? Platform.adapter.name : 'none',
      lane: r ? r.lane : -1, shipX: r ? r.shipX : -1, speed: r ? r.speed : 0,
      dist: r ? r.dist_m : 0, coins: r ? r.coins : 0, fuel: r ? r.fuel : 0,
      ents: r ? r.entities.length : 0, fps: SD.perf.fps,
      shield: r ? r.shield : false, magnetT: r ? r.magnetT : 0, doubleT: r ? r.doubleT : 0,
      dodges: r ? r.dodges : 0, hits: r ? r.hitsTaken : 0, over: r ? r.over : true,
      combo: r ? r.combo : 0, storm: r ? r.storm : 0,
      trait: r ? r.trait : '', bombs: r ? r.bombs : 0, od: r ? Object.assign({}, r.od) : null,
      slowT: r ? r.slowT : 0, phaseT: r ? r.phaseT : 0, bonusT: r ? r.bonusT : 0,
      stars: r ? r.stars : 0,
      quests: S.save && S.save.quests ? S.save.quests.list.map(q => Object.assign({}, q)) : [],
      questStreak: S.save ? Object.assign({}, S.save.questStreak) : null,
      weekly: S.save ? (S.save.weekly || []).slice(0, 5) : [],
      adProgress: S.save ? Object.assign({}, S.save.ad_progress) : {},
      saveCoins: S.save ? S.save.coins : 0,
      unlocked: S.save ? S.save.ships_unlocked.length : 0,
      missions: S.save ? S.save.missions_completed.length : 0,
      achievements: S.save ? S.save.achievements.length : 0,
      rowsTotal: S.run ? S.run.gen.rowCount : 0,
      perf: Object.assign({}, SD.perf), events: Object.assign({}, SD.events), errors: SD.errors.slice(),
      input: Object.assign({}, SD.input),
      boost: Object.assign({}, S.boost),
      particles: P.length,
    };
  },
  rows(n) { const r = S.run; if (!r) return []; return r.gen.rows.slice(-(n || 100)); },
  startRun(mode, opts) { startRun(mode || 'endless', opts || {}); },
  endRun(reason) { endRun(reason || 'crash'); },
  continueRun,
  moveLane(dir) { return moveLane(dir); },
  bot(on) { S.bot = !!on; },
  god(on) { S.god = !!on; },
  setLang(l) { switchLang(l); },
  toast,
  save: () => S.save,
  setSave(o) { S.save = sanitizeSave(o); saveGame(true); },
  tutSkip() { S.save.tutorial_done = true; S.tut.active = false; D.tut.classList.remove('active'); },
  showScreen,
  addEnt(type, lane, dy) {
    const r = S.run; if (!r) return false;
    const shipY = L.fieldHcells - CFG.SHIP_Y;
    const dist = r.travelled + shipY - (dy === undefined ? 4 : dy);
    if (type === 'coin') r.entities.push({ kind: 'coin', type: 'coin', x: lane, lane, dist, taken: false, ph: 0 });
    else if (type === 'fuel' || type === 'shield' || type === 'magnet' || type === 'double')
      r.entities.push({ kind: 'item', type, x: lane, lane, dist, taken: false, ph: 0 });
    else r.entities.push({ kind: 'obs', type, x: lane, lane, dist, drift: 0, age: 0, rot: 0, vr: 0, astI: 0, passed: false, hitDone: false, ph: 0 });
    return true;
  },
  setFuel(v) { if (S.run) S.run.fuel = v; },
  setFuelDrain(v) { if (S.run) S.run.fuelDrain = v; },
  grantAll() {
    S.save.coins += 100000;
    for (const s of SHIPS) if (S.save.ships_unlocked.indexOf(s.id) === -1) S.save.ships_unlocked.push(s.id);
    saveGame(true);
  },
  dailyKey: todayKey,
  layoutInfo: () => ({ cell: L.cell, fieldX: L.fieldX, fieldW: L.fieldW, fieldHcells: L.fieldHcells, cw: L.cw, ch: L.ch }),
  audioState: () => ({ ctx: Aud.ctx ? Aud.ctx.state : 'none', muted: Aud.gpMute, engine: !!Aud.eng, music: !!Aud.musicTimer }),
  interstitialReset() { S.lastInter = 0; S.sessionStart = 0; },
  /* promo scene rendered from the game's own pixel assets (store icon / cover) */
  artExport(kind) {
    const W = kind === 'icon' ? 1024 : 1920, H = kind === 'icon' ? 1024 : 1080;
    const c = mc(W, H), g = c.getContext('2d');
    g.imageSmoothingEnabled = false;
    const bands = ['#0b0f22', '#0d1226', '#10152b', '#131831', '#161b37'];
    const bh = H / bands.length;
    bands.forEach((col, i) => { g.fillStyle = col; g.fillRect(0, Math.floor(i * bh), W, Math.ceil(bh) + 3); });
    const rnd = mulberry32(777);
    for (let i = 0; i < 260; i++) {
      g.fillStyle = i % 3 ? '#8fa3d9' : '#e8f2ff';
      const sz = i % 13 === 0 ? 3 : 2;
      g.fillRect(Math.floor(rnd() * W), Math.floor(rnd() * H), sz, sz);
    }
    const pr = kind === 'icon' ? 300 : 240;
    const px = kind === 'icon' ? 210 : 1560, py = kind === 'icon' ? 780 : 330;
    g.fillStyle = '#2c2450'; g.beginPath(); g.arc(px, py, pr, 0, 7); g.fill();
    g.fillStyle = '#241d40';
    for (let y = -pr; y < pr; y += 4) for (let x = 0; x < pr; x += 4) g.fillRect(px + x + (y % 8 === 0 ? 2 : 0), py + y, 2, 2);
    g.fillStyle = '#5b4a86';
    for (let a = 0; a < 6.28; a += 0.01) {
      const rx = Math.cos(a) * pr * 1.5, ry = Math.sin(a) * pr * 0.38;
      g.fillRect(Math.floor(px + rx * Math.cos(-0.18) - ry * Math.sin(-0.18)), Math.floor(py + rx * Math.sin(-0.18) + ry * Math.cos(-0.18)), 3, 3);
    }
    const sc = kind === 'icon' ? 26 : 17;
    const draw = (low, x, y, s2) => g.drawImage(low, 0, 0, low.width, low.height, Math.round(x), Math.round(y), Math.round(low.width * s2), Math.round(low.height * s2));
    draw(LOW.ast[0], W * 0.10, H * 0.13, sc * 0.62);
    draw(LOW.ast[1], W * 0.74, H * 0.64, sc * 0.7);
    draw(LOW.ast[2], W * 0.78, H * 0.10, sc * 0.45);
    draw(LOW.coin[0], W * 0.18, H * 0.70, sc * 0.5);
    draw(LOW.coin[1], W * 0.26, H * 0.58, sc * 0.4);
    draw(LOW.coin[2], W * 0.84, H * 0.36, sc * 0.42);
    draw(LOW.ships[2], W * 0.10, H * 0.42, sc * 0.4);
    draw(LOW.ships[7], W * 0.85, H * 0.50, sc * 0.4);
    draw(LOW.ships[0], W * 0.5 - 7 * sc, H * 0.46 - 8 * sc, sc);
    return c.toDataURL('image/png');
  },
};

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();

</script>

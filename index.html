
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0b0f22">
<title>Космический Забег — Space Dash</title>
<style>
  /* ============ SPACE DASH v3 — flat pixel-arcade UI ============
     Palette: panel #161c3a / line #2e3a6e / ink #e8eef7 / mut #8fa3d9
     gold #ffd76a / red #e0503c / green #58d68d / blue #3552b8 /
     purple #7229d3 / cyan #7edcff. Hard shadows, 2px borders,
     4px radii. No gradients-on-everything, no glass, no emoji. */
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0b0f22;
    font-family:system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
    user-select:none; -webkit-user-select:none; touch-action:none; overscroll-behavior:none;
    color:#e8eef7; }
  #cv { position:fixed; inset:0; width:100%; height:100%; display:block; image-rendering:pixelated; }
  #ui { position:fixed; inset:0; pointer-events:none; }
  #ui .screen, #ui .overlay { pointer-events:auto; }
  svg.pic { display:inline-block; vertical-align:-2px; }
  i[data-ic] { display:inline-flex; font-style:normal; }

  .screen { position:absolute; inset:0; display:none; flex-direction:column; align-items:center;
    padding:calc(12px + env(safe-area-inset-top)) 14px calc(12px + env(safe-area-inset-bottom)); overflow:hidden; }
  #scr-menu { overflow-y:auto; touch-action:pan-y; scrollbar-width:none; }
  #scr-menu::-webkit-scrollbar { display:none; }
  #scr-menu.fit-scaled { overflow:hidden; }
  #scr-menu .panel { transform-origin:top center; transition:transform .15s ease; }
  /* compact base metrics so the menu fits even before scaling */
  #scr-menu .panel { gap:9px; }
  #scr-menu .title { margin:2px 0 0; font-size:clamp(22px,5.8vw,38px); }
  #scr-menu .boost-row { gap:7px; }
  #scr-menu .qcard { padding:7px 9px; }
  #scr-menu .qrow { padding:2px 0; font-size:11px; }
  @media (max-height:760px) {
    #scr-menu .panel { gap:7px; }
    #scr-menu .btn { padding:10px 14px; font-size:14px; }
    #scr-menu .qcard { display:none; }          /* квесты дублируются в челлендже дня и миссиях */
  }
  @media (max-height:600px) {
    #scr-menu .boost-row { display:none; }
    #scr-menu .subtitle { display:none; }
  }
  .screen.active { display:flex; }
  .panel { width:100%; max-width:440px; display:flex; flex-direction:column; align-items:center; gap:12px; }
  #scr-menu .panel { margin:auto 0; }

  .title { font-size:clamp(26px,6.6vw,42px); font-weight:900; letter-spacing:3px; text-align:center;
    color:#ffffff; text-shadow:0 4px 0 #7229d3, 0 8px 0 rgba(0,0,0,.45); margin:6px 0 2px; }
  .subtitle { color:#8fa3d9; font-size:13px; font-weight:700; letter-spacing:1px; }

  .btn { pointer-events:auto; position:relative; border:2px solid #0a0d20; cursor:pointer; color:#fff;
    font-weight:800; letter-spacing:1.2px; border-radius:4px; padding:13px 18px; font-size:15px;
    width:100%; max-width:340px; background:#3552b8; box-shadow:0 4px 0 #0a0d20;
    transition:transform .06s, box-shadow .06s; text-shadow:0 1px 0 rgba(0,0,0,.35); }
  .btn:active { transform:translateY(3px); box-shadow:0 1px 0 #0a0d20; }
  .btn.gold { background:#f2a93b; color:#3a2400; text-shadow:none; }
  .btn.green { background:#58d68d; color:#06281a; text-shadow:none; }
  .btn.purple { background:#8a4bd6; }
  .btn.gray { background:#4a5578; }
  .btn.small { width:auto; padding:8px 13px; font-size:12.5px; }
  .btn:disabled { filter:grayscale(.7) brightness(.6); cursor:default; }
  .row { display:flex; gap:9px; width:100%; max-width:340px; justify-content:center; }
  .row .btn { flex:1; }
  #btn-ach, #btn-ships { font-size:12.5px; letter-spacing:.6px; }

  .coins-pill { display:flex; align-items:center; gap:7px; background:#161c3a;
    border:2px solid #2e3a6e; border-radius:4px; padding:6px 13px; color:#ffd76a;
    font-weight:900; font-size:15px; box-shadow:0 3px 0 #0a0d20; }
  .coins-pill .ic { display:flex; }
  .h2 { color:#e8eef7; font-size:19px; font-weight:900; letter-spacing:2px; text-align:center; }
  .backtop { display:flex; align-items:center; gap:10px; width:100%; max-width:440px; }
  .backtop .btn { width:auto; flex:0 0 auto; }
  .backtop .h2 { flex:1; }
  .list { width:100%; max-width:440px; overflow-y:auto; -webkit-overflow-scrolling:touch;
    display:flex; flex-direction:column; gap:8px; padding:6px 2px 18px; touch-action:pan-y; flex:1; min-height:0;
    scrollbar-width:thin; scrollbar-color:#2e3a6e transparent; }
  .list::-webkit-scrollbar { width:6px; }
  .list::-webkit-scrollbar-thumb { background:#2e3a6e; }
  .card { background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:10px 12px; color:#e8eef7;
    display:flex; align-items:center; gap:10px; box-shadow:0 3px 0 #0a0d20; }
  .card .cbody { flex:1; min-width:0; }
  .card .cname { font-weight:800; font-size:13.5px; }
  .card .csub { color:#8fa3d9; font-size:11.5px; margin-top:3px; }
  .card.done { border-color:#2f7a52; }
  .pbar { height:8px; background:#0a0d20; border:1px solid #2e3a6e; margin-top:6px; }
  .pbar i { display:block; height:100%; background:#58d68d;
    background-image:repeating-linear-gradient(90deg, rgba(10,13,32,0) 0 6px, #0a0d20 6px 8px); }
  .tag { font-size:11px; font-weight:900; color:#06281a; background:#58d68d; border:2px solid #0a0d20;
    border-radius:3px; padding:2px 7px; }
  .tag.lock { background:#4a5578; color:#0b0f22; }

  .grid { display:grid; grid-template-columns:repeat(2,1fr); gap:8px; width:100%; }
  .shipcard { background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:8px;
    cursor:pointer; position:relative; box-shadow:0 3px 0 #0a0d20;
    display:flex; gap:8px; align-items:center; text-align:left; }
  .shipcard:active { transform:translateY(2px); box-shadow:0 1px 0 #0a0d20; }
  .shipcard canvas { width:64px; height:68px; flex:0 0 64px; image-rendering:pixelated; }
  .shipcard .sbody { flex:1; min-width:0; }
  .shipcard .sn { font-size:11px; color:#e8eef7; font-weight:800; line-height:1.2; }
  .shipcard .sdesc { font-size:9.5px; color:#8fa3d9; font-weight:700; line-height:1.3; margin-top:3px; }
  .shipcard.sel { border-color:#ffd76a; box-shadow:0 3px 0 #0a0d20, 0 0 0 2px #ffd76a; }
  .shipcard.locked .shipimg { filter:grayscale(1) brightness(.45); }
  .shipcard .cost { position:absolute; top:3px; right:3px; font-size:9px; font-weight:900; color:#ffd76a;
    background:#0a0d20; border:1px solid #6b5a26; border-radius:3px; padding:1px 4px; }

  #hud { position:absolute; top:0; left:0; right:0; display:none;
    padding:calc(9px + env(safe-area-inset-top)) 10px 0; pointer-events:none; }
  #hud.active { display:block; }
  .hudbar { display:flex; align-items:center; gap:8px; max-width:440px; margin:0 auto; }
  .hudbox { background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:4px 10px;
    color:#e8eef7; font-weight:900; font-size:13.5px; white-space:nowrap; box-shadow:0 3px 0 #0a0d20; }
  #hud-coins { color:#ffd76a; border-color:#6b5a26; }
  #btn-pause { pointer-events:auto; margin-left:auto; width:40px; height:40px; border-radius:4px;
    border:2px solid #0a0d20; background:#4a5578; color:#e8eef7; font-size:14px; font-weight:900;
    cursor:pointer; box-shadow:0 3px 0 #0a0d20; }
  #fuelwrap { max-width:440px; margin:7px auto 0; height:12px; background:#0a0d20;
    border:2px solid #2e3a6e; }
  #hud-fuel { height:100%; width:100%; background:#58d68d;
    background-image:repeating-linear-gradient(90deg, rgba(10,13,32,0) 0 8px, #0a0d20 8px 10px); }
  #hud-fuel.low { background-color:#e0503c; animation:blink .7s steps(2) infinite; }
  @keyframes blink { 50% { opacity:.45; } }
  #speedwrap { max-width:440px; margin:4px auto 0; height:6px; background:#0a0d20; border:1px solid #2e3a6e; }
  #hud-speed { height:100%; width:0%; background:#8a4bd6; }
  #pu-chips { position:absolute; top:calc(102px + env(safe-area-inset-top)); left:0; right:0; display:flex;
    gap:6px; justify-content:center; flex-wrap:wrap; padding:0 8px; }
  .pu-chip { background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:3px 9px;
    font-size:11.5px; font-weight:900; color:#7edcff; box-shadow:0 2px 0 #0a0d20; }
  .pu-chip.magnet { color:#ff9db4; }
  .pu-chip.double { color:#ffd76a; }
  .pu-chip.combo { color:#ffb27a; border-color:#7a4a26; }
  .pu-chip.storm { color:#ff6b5e; border-color:#7a2620; animation:blink .6s steps(2) infinite; }

  .overlay { position:absolute; inset:0; display:none; align-items:center; justify-content:center;
    background:rgba(6,8,20,.84); padding:16px; }
  .overlay.active { display:flex; }
  .obox { width:100%; max-width:390px; background:#161c3a; border:2px solid #2e3a6e; border-radius:6px;
    padding:20px 16px; display:flex; flex-direction:column; gap:10px; align-items:center;
    box-shadow:0 6px 0 #0a0d20; max-height:92vh; overflow-y:auto; touch-action:pan-y;
    animation:pop .16s ease-out; }
  @keyframes pop { from { transform:scale(.92); opacity:.4; } }
  .otitle { font-size:23px; font-weight:900; letter-spacing:2px; color:#ffd76a; text-align:center;
    text-shadow:0 3px 0 #7a4a00; }
  .ostats { display:flex; gap:15px; color:#cfe0ff; font-weight:800; font-size:13.5px; flex-wrap:wrap; justify-content:center; }
  .ostats b { color:#fff; }
  .omsg { color:#58d68d; font-weight:800; font-size:13.5px; text-align:center; }
  #over-ach { white-space:pre-line; line-height:1.5; }
  #over-record { color:#ffd76a; font-size:16px; letter-spacing:1px; animation:blink .8s steps(2) 3; }

  #ui .overlay#tut { background:rgba(6,8,20,.35); pointer-events:none; }
  #tut.active { display:flex; }
  #tut .tbox { pointer-events:auto; max-width:350px; text-align:center; }
  #tut-text { color:#e8eef7; font-size:18px; font-weight:800; line-height:1.4;
    background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:13px 17px;
    box-shadow:0 4px 0 #0a0d20; }
  #btn-tut-skip { margin-top:14px; }
  #tut-hand { margin:14px auto 0; width:120px; animation:swipe 1.1s steps(2) infinite; }
  @keyframes swipe { 0%,100% { transform:translateX(-26px); } 50% { transform:translateX(26px); } }

  #toast-box { position:absolute; top:calc(20px + env(safe-area-inset-top)); left:0; right:0; display:flex;
    flex-direction:column; align-items:center; gap:6px; pointer-events:none; z-index:50; }
  .toast { background:#161c3a; border:2px solid #6b5a26; color:#ffe9b0; font-weight:800; font-size:12.5px;
    border-radius:4px; padding:8px 15px; box-shadow:0 3px 0 #0a0d20; animation:tin .2s ease-out;
    max-width:88vw; text-align:center; }
  @keyframes tin { from { transform:translateY(-12px); opacity:0; } }

  .boost-row { display:flex; gap:9px; width:100%; max-width:340px; }
  .boost { flex:1; background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:7px 8px;
    color:#cfe0ff; font-size:11px; font-weight:800; display:flex; flex-direction:column; gap:5px;
    align-items:center; box-shadow:0 3px 0 #0a0d20; }
  .boost > span { display:flex; align-items:center; gap:5px; }
  .boost.on { border-color:#2f7a52; }
  .boost .bb { display:flex; gap:5px; width:100%; }
  .boost .btn { padding:6px 4px; font-size:10px; border-radius:3px; max-width:none; box-shadow:0 2px 0 #0a0d20; }

  #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    color:#8fa3d9; font-weight:800; letter-spacing:3px; background:#0b0f22; z-index:100; transition:opacity .4s; }
  .flagbtn { font-size:20px; background:#161c3a; border:2px solid #2e3a6e; border-radius:4px;
    padding:5px 14px; cursor:pointer; color:#e8eef7; box-shadow:0 3px 0 #0a0d20; }
  .flagbtn.sel { border-color:#ffd76a; }
  .sett { width:100%; max-width:340px; display:flex; align-items:center; justify-content:space-between;
    background:#161c3a; border:2px solid #2e3a6e; border-radius:4px; padding:10px 14px;
    color:#e8eef7; font-weight:800; font-size:14px; box-shadow:0 3px 0 #0a0d20; }

  #scr-menu.active .panel > * { animation:menuIn .3s ease-out backwards; }
  #scr-menu.active .panel > *:nth-child(1){animation-delay:.02s}
  #scr-menu.active .panel > *:nth-child(2){animation-delay:.06s}
  #scr-menu.active .panel > *:nth-child(3){animation-delay:.10s}
  #scr-menu.active .panel > *:nth-child(4){animation-delay:.14s}
  #scr-menu.active .panel > *:nth-child(5){animation-delay:.18s}
  #scr-menu.active .panel > *:nth-child(6){animation-delay:.22s}
  @keyframes menuIn { from { transform:translateY(12px); opacity:0; } }

  /* skill bar */
  #skill-bar { position:absolute; right:calc(10px + env(safe-area-inset-right)); bottom:calc(14px + env(safe-area-inset-bottom));
    display:flex; flex-direction:column; gap:8px; pointer-events:none; }
  .sk { pointer-events:auto; display:flex; align-items:center; gap:6px; border:2px solid #0a0d20; border-radius:4px;
    background:#161c3a; color:#ffd76a; padding:7px 9px; cursor:pointer; box-shadow:0 3px 0 #0a0d20;
    font-weight:900; font-size:10px; letter-spacing:.5px; }
  .sk em { font-style:normal; color:#8fa3d9; }
  .sk.on { border-color:#7a4a26; color:#ffb27a; animation:blink .5s steps(2) infinite; }
  .sk.off { opacity:.45; }
  /* quests / weekly cards */
  .qcard { padding:8px 10px; }
  .qhead { font-weight:900; font-size:12px; letter-spacing:1px; color:#cfe0ff; margin-bottom:5px;
    display:flex; align-items:center; gap:6px; }
  .qrow { display:flex; align-items:center; gap:7px; padding:3px 0; font-size:11.5px; color:#aebcdf; }
  .qrow .qt { flex:1; min-width:0; font-weight:700; }
  .qrow .qp { color:#8fa3d9; font-weight:800; white-space:nowrap; }
  .qrow .qp.rw { color:#ffd76a; }
  .qrow.done .qt { color:#58d68d; text-decoration:line-through; }
  .qrow.chest { border-top:1px dashed #2e3a6e; margin-top:4px; padding-top:6px; }
  .qrow .btn { padding:4px 8px; font-size:10px; box-shadow:0 2px 0 #0a0d20; }
  /* ship passport */
  .sd-stars { color:#ffd76a; font-size:20px; letter-spacing:4px; text-shadow:0 2px 0 #0a0d20; }
  .sd-traitbox { background:#10152c; border:2px solid #2e3a6e; border-radius:4px; padding:5px 12px;
    color:#7edcff; font-weight:900; font-size:13px; letter-spacing:1px; }
  .sd-desc { color:#aebcdf; font-size:12.5px; line-height:1.45; text-align:center; font-weight:600;
    max-width:290px; }
  .sd-note { color:#8fa3d9; font-size:11px; line-height:1.4; font-weight:700; text-align:center;
    background:#10152c; border:1px dashed #2e3a6e; border-radius:4px; padding:6px 9px; }
  .sd-stats { width:100%; display:flex; flex-direction:column; gap:4px; }
  .sd-stats .st { display:flex; justify-content:space-between; font-size:11.5px; color:#8fa3d9; font-weight:800;
    background:#10152c; border:1px solid #232c55; border-radius:3px; padding:3px 8px; }
  .sd-stats .st b { color:#e8eef7; }
  .sd-mast { width:100%; display:flex; flex-direction:column; gap:3px; }
  .sd-mast .mrow { display:flex; align-items:center; gap:6px; font-size:11px; color:#8fa3d9; font-weight:700; }
  .sd-mast .mrow.done { color:#58d68d; }
  .sd-mast .mrow .mv { margin-left:auto; color:#cfe0ff; }
  /* ship card meta */
  .shipcard .tr { font-size:8.5px; color:#7edcff; font-weight:800; line-height:1.2; height:20px; overflow:hidden; }
  .shipcard .stars { color:#ffd76a; letter-spacing:1px; }

  @media (orientation:landscape) and (max-height:560px) {
    .title { font-size:24px; margin:0; }
    .btn { padding:9px 12px; font-size:12.5px; }
    .panel { gap:6px; flex-direction:row; flex-wrap:wrap; justify-content:center; max-width:780px; }
    .panel .coins-pill, .panel .subtitle { flex-basis:100%; }
    .panel .btn { width:auto; flex:0 1 190px; }
    .panel .boost-row { flex-basis:100%; max-width:400px; }
  }
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="ui">
  <!-- MENU -->
  <div id="scr-menu" class="screen">
    <div class="panel">
      <div class="coins-pill"><span class="ic"></span><span id="menu-coins">0</span></div>
      <div class="title" data-i18n="app_name">Космический Забег</div>
      <div class="subtitle" id="menu-best"></div>
      <button id="btn-play" class="btn gold" data-i18n="play">ИГРАТЬ</button>
      <div class="boost-row">
        <div class="boost" id="bst-shield">
          <span><i data-ic="shield" data-ic-size="14"></i> <span data-i18n="booster_shield">Стартовый щит</span></span>
          <div class="bb">
            <button class="btn small green" id="bst-shield-buy"></button>
            <button class="btn small purple" id="bst-shield-ad" data-i18n="booster_ad">▶</button>
          </div>
        </div>
        <div class="boost" id="bst-magnet">
          <span><i data-ic="magnet" data-ic-size="14"></i> <span data-i18n="booster_magnet">Стартовый магнит</span></span>
          <div class="bb">
            <button class="btn small green" id="bst-magnet-buy"></button>
            <button class="btn small purple" id="bst-magnet-ad" data-i18n="booster_ad">▶</button>
          </div>
        </div>
      </div>
      <div class="card qcard" style="width:100%;max-width:340px"><div class="cbody" id="quests-box"></div></div>
      <div class="card qcard" style="width:100%;max-width:340px"><div class="cbody" id="weekly-box"></div></div>
      <div class="row">
        <button id="btn-missions" class="btn" data-i18n="missions">МИССИИ</button>
        <button id="btn-daily" class="btn purple" data-i18n="daily">ЧЕЛЛЕНДЖ ДНЯ</button>
      </div>
      <div class="row">
        <button id="btn-ships" class="btn" data-i18n="ships">КОРАБЛИ</button>
        <button id="btn-ach" class="btn" data-i18n="achievements">ДОСТИЖЕНИЯ</button>
        <button id="btn-set" class="btn gray" style="flex:0 0 52px" aria-label="settings"></button>
      </div>
    </div>
  </div>

  <!-- MISSIONS -->
  <div id="scr-missions" class="screen">
    <div class="backtop">
      <button class="btn small gray" data-back="menu">◀</button>
      <div class="h2" data-i18n="missions">МИССИИ</div>
      <div class="coins-pill"><span class="ic"></span><span class="mc-coins">0</span></div>
    </div>
    <div class="list" id="missions-list"></div>
  </div>

  <!-- DAILY -->
  <div id="scr-daily" class="screen">
    <div class="backtop">
      <button class="btn small gray" data-back="menu">◀</button>
      <div class="h2" data-i18n="daily_today">Испытание дня</div>
      <div class="coins-pill"><span class="ic"></span><span class="mc-coins">0</span></div>
    </div>
    <div class="panel" style="margin-top:12px">
      <div class="card" style="width:100%"><div class="cbody">
        <div class="cname" id="daily-mod"></div>
        <div class="csub" id="daily-best"></div>
        <div class="csub" id="daily-streak"></div>
        <div class="csub" id="daily-rewarded"></div>
      </div></div>
      <button id="btn-daily-play" class="btn gold" data-i18n="daily_play">НАЧАТЬ ИСПЫТАНИЕ</button>
      <button class="btn gray small" data-back="menu" data-i18n="to_menu">В меню</button>
    </div>
  </div>

  <!-- SHIPS -->
  <div id="scr-ships" class="screen">
    <div class="backtop">
      <button class="btn small gray" data-back="menu">◀</button>
      <div class="h2" id="ships-count"></div>
      <div class="coins-pill"><span class="ic"></span><span class="mc-coins">0</span></div>
    </div>
    <div class="list"><div class="grid" id="ships-grid"></div></div>
  </div>

  <!-- SHIP PASSPORT -->
  <div id="scr-ship" class="overlay">
    <div class="obox" style="max-width:340px">
      <canvas id="sd-sprite" width="120" height="128" style="image-rendering:pixelated"></canvas>
      <div class="otitle" id="sd-name" style="font-size:19px"></div>
      <div id="sd-stars" class="sd-stars"></div>

/* ============================================================
 * SPACE DASH v3 — PIXEL ART sprite bank
 * Hand-placed pixel maps (15×16 ships, 15×15 rocks, 4-frame coin
 * spin, 3-frame flame & explosion). Rendered 1 px = 1 canvas px
 * into low-res canvases; the game bakes them at an integer scale
 * with imageSmoothing off — crisp, deliberate, human-made look.
 * Palette chars: . transparent | K outline | C main | D dark |
 * L light | W white | G glass | E engine metal | e engine glow
 * ============================================================ */
'use strict';

function pShade(hex, t) {
  const n = parseInt(hex.slice(1), 16);
  let r = (n >> 16) & 255, g = (n >> 8) & 255, b = n & 255;
  const target = t < 0 ? 0 : 255;
  const k = Math.abs(t);
  r = Math.round(r + (target - r) * k);
  g = Math.round(g + (target - g) * k);
  b = Math.round(b + (target - b) * k);
  return `rgb(${r},${g},${b})`;
}

/* ===== generator.js ===== */
/* ============================================================
 * SPACE DASH v2 — procedural obstacle generator
 * PASSABILITY GUARANTEES:
 *  G1: a row never blocks all 3 lanes (max 2 static blocks, and
 *      rows with moving hazards (debris/black hole) block only 1).
 *  G2: when rows come fast (time gap < 0.65 s), the free-lane set
 *      always overlaps the previous row's free-lane set.
 * All rows are recorded in a ring buffer for QA autotests.
 * Deterministic when a seed is given (daily challenge).
 * ============================================================ */
'use strict';

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

class Generator {
  constructor(opts) {
    opts = opts || {};
    this.rnd = mulberry32(opts.seed || ((Date.now() ^ (Math.random() * 0xffffffff)) >>> 0));
    this.mod = opts.mod || 'normal';
    this.nextRowDist = 16;
    this.lastFree = [0, 1, 2];
    this.canAt = 22;
    this.puAt = 50;
    this.gateAt = 55;
    this.evAt = 70;
    this.evKind = 0;
    this.density = opts.density || 1;
    this.rows = [];
    this.rowCount = 0;
  }

  static intervalTime(t, mod, wave) {
    let it;
    if (t < 15) it = 1.55 - t * 0.014;                 // 1.55 → 1.34 (hook)
    else if (t < 45) it = 1.34 - (t - 15) * 0.011;     // → 1.01
    else it = Math.max(0.45, 1.01 - (t - 45) * 0.0052); // → 0.45 (~2.5 min)
    if (mod === 'storm') it *= 0.82;
    if (mod === 'fast') it *= 0.92;
    if (wave) it *= 0.62;                              // storm wave
    return it;
  }

  update(travelled, t, spd, lookahead, wave, density) {
    const out = [];
    const horizon = travelled + (lookahead || 30);
    let safety = 0;
    while (this.nextRowDist <= horizon && safety++ < 64) {
      const tRow = t + (this.nextRowDist - travelled) / Math.max(1, spd);
      const row = this.makeRow(this.nextRowDist, tRow, !!wave);
      out.push(row);
      this.rowCount++;
      const gap = Math.max(3.6, spd * Generator.intervalTime(tRow, this.mod, wave) / (density || this.density || 1));
      this.rows.push({ dist: row.dist, blocked: row.blocked.slice(), free: row.free.slice(), gap, tRow, spd });
      void wave;
      if (this.rows.length > 500) this.rows.shift();
      this.nextRowDist += gap;
    }
    return out;
  }

  _freeOf(blocked) { return [0, 1, 2].filter(l => blocked.indexOf(l) === -1); }

  makeRow(dist, t, wave) {
    const rnd = this.rnd;
    const storm = this.mod === 'storm' || !!wave;
    const clean = this.mod === 'clean';
    const rain = this.mod === 'rain';

    let blockCount;
    if (t < 15) blockCount = rnd() < 0.8 ? 1 : 0;
    else if (t < 45) blockCount = rnd() < (storm ? 0.45 : 0.62) ? 1 : 2;
    else blockCount = rnd() < (storm ? 0.25 : 0.38) ? 1 : 2;
    if (storm && t >= 15 && blockCount === 1 && rnd() < 0.35) blockCount = 2;
    if (blockCount > 2) blockCount = 2;

    let blocked = [];
    const pool = [0, 1, 2];
    for (let i = 0; i < blockCount; i++) blocked.push(pool.splice(Math.floor(rnd() * pool.length), 1)[0]);

    const strict = Generator.intervalTime(t, this.mod, wave) < 0.65;
    let free = this._freeOf(blocked);
    if (strict && blocked.length && !free.some(f => this.lastFree.indexOf(f) !== -1)) {
      const keep = this.lastFree[Math.floor(rnd() * this.lastFree.length)];
      blocked = blocked.filter(b => b !== keep);
      free = this._freeOf(blocked);
    }

    const obstacles = [];
    if (blocked.length) {
      let moving = null;
      for (const lane of blocked) {
        const r = rnd();
        let type = 'asteroid';
        if (t >= 45 && r < 0.12) type = 'blackhole';
        else if (!clean && t >= 20 && r < 0.34) type = 'debris';
        if (type !== 'asteroid') { moving = { type, lane }; break; }
      }
      // late game: paired debris wall (still ≤2 blocked lanes → G1 holds)
      if (!moving && !clean && t >= 90 && blocked.length === 2 && rnd() < 0.22) {
        obstacles.push({ type: 'debris', lane: blocked[0], drift: (rnd() < 0.5 ? -1 : 1) * (0.3 + rnd() * 0.2) });
        obstacles.push({ type: 'debris', lane: blocked[1], drift: (rnd() < 0.5 ? -1 : 1) * (0.3 + rnd() * 0.2) });
        this.lastFree = free;
        const items2 = [];
        void items2;
        return this._finishRow(dist, blocked, free, obstacles, t, rain);
      }
      if (moving) {
        obstacles.push({
          type: moving.type, lane: moving.lane,
          drift: moving.type === 'debris' ? (rnd() < 0.5 ? -1 : 1) * (0.26 + rnd() * 0.14) : 0,
        });
        blocked = [moving.lane];
        free = this._freeOf(blocked);
      } else {
        for (const lane of blocked) obstacles.push({ type: 'asteroid', lane, drift: 0 });
      }
    }
    this.lastFree = free;

    // ---- gate event (~every 45 s): pillar + reward corridor ----
    if (t >= this.gateAt) {
      this.gateAt = t + 45;
      const side = rnd() < 0.5 ? 2 : 0;            // pillar lane
      const gObs = [{ type: 'pillar', lane: side, drift: 0 }];
      const gItems = [];
      const lanes = [0, 1, 2].filter(l => l !== side);
      if (rnd() < 0.5) {
        for (const ln of lanes) for (let i = 0; i < 4; i++) gItems.push({ type: 'coin', lane: ln, d: dist + 1 + i * 0.9 });
      } else {
        for (const ln of lanes) gItems.push({ type: 'boost', lane: ln, d: dist + 2 });
        for (let i = 0; i < 3; i++) gItems.push({ type: 'coin', lane: lanes[i % 2], d: dist + 4 + i * 0.9 });
      }
      this.lastFree = lanes;
      return { dist, blocked: [side], free: lanes, obstacles: gObs, items: gItems };
    }
    // ---- trader / portal (~every 65 s) ----
    if (t >= this.evAt) {
      this.evAt = t + 65;
      this.evKind ^= 1;
      const lane = free[Math.floor(rnd() * free.length)] ?? 1;
      const evItems = [{ type: this.evKind ? 'portal' : 'trader', lane, d: dist + 4 }];
      return this._finishRow(dist, blocked, free, obstacles.concat([]), t, rain, evItems);
    }
    return this._finishRow(dist, blocked, free, obstacles, t, rain);
  }

  _finishRow(dist, blocked, free, obstacles, t, rain, extra) {
    const rnd = this.rnd;
    const items = (extra || []).slice();
    const safe = free.filter(f => !obstacles.some(o => o.type === 'debris' && Math.abs(o.lane - f) < 1));
    const pickLane = safe.length ? safe : free;
    const rl = () => pickLane[Math.floor(rnd() * pickLane.length)];

    const coinChance = t < 15 ? 0.92 : (rain ? 0.95 : 0.6);
    if (pickLane.length && rnd() < coinChance) {
      const lane = rl();
      const n = t < 15 ? 4 + Math.floor(rnd() * 2) : 3 + Math.floor(rnd() * 3);
      for (let i = 0; i < n; i++) items.push({ type: 'coin', lane, d: dist + i * 0.95 });
    }
    if (t >= this.canAt) {
      this.canAt = t + 25 + rnd() * 10;
      if (pickLane.length) items.push({ type: 'fuel', lane: rl(), d: dist + 2.1 });
    }
    if (t >= this.puAt) {
      this.puAt = t + 45 + rnd() * 25;
      const kinds = ['shield', 'magnet', 'double'];
      if (pickLane.length) items.push({ type: kinds[Math.floor(rnd() * 3)], lane: rl(), d: dist + 3.3 });
    }
    return { dist, blocked, free, obstacles, items };
  }
}

/* ============================================================
 * SPACE DASH v2 — LocalAdapter (no SDK: debug, adblockers, offline)

'use strict';

const LocalAdapter = {
  name: 'local',
  _cbs: {},
  _store: null,
  init() {
    try { this._store = window.localStorage; } catch (e) { this._store = null; }
    return Promise.resolve();
  },
  ready() { return Promise.resolve(); },
  gameplayStart() {},
  gameplayStop() {},
  on(ev, cb) { (this._cbs[ev] = this._cbs[ev] || []).push(cb); },
  off(ev, cb) {
    const a = this._cbs[ev]; if (!a) return;
    const i = a.indexOf(cb); if (i >= 0) a.splice(i, 1);
  },
  _emit(ev, arg) { (this._cbs[ev] || []).slice().forEach(cb => { try { cb(arg); } catch (e) {} }); },
  _mock() {
    if (this._mockFlag === undefined) {
      try { this._mockFlag = new URLSearchParams(location.search).has('adsmock'); } catch (e) { this._mockFlag = false; }
    }
    return this._mockFlag;
  },
  _simAd(kind, done) {
    const ov = document.createElement('div');
    ov.id = 'sim-ad';
    ov.style.cssText = 'position:fixed;inset:0;z-index:999;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;flex-direction:column;gap:12px;font-family:system-ui,sans-serif';
    ov.innerHTML = '<div style="border:2px solid #ffd76a;background:#161c3a;color:#ffd76a;font-weight:900;font-size:20px;letter-spacing:2px;padding:22px 34px;border-radius:8px">SIM AD · ' + kind.toUpperCase() + '</div>' +
      '<div id="sim-cd" style="color:#8fa3d9;font-weight:800;font-size:15px">3…</div>' +
      '<div style="color:#5b6478;font-size:11px;font-weight:700">debug ?adsmock=1: реальная реклама — в VK (mobile) и GamePush</div>';
    document.body.appendChild(ov);
    let t = 3;
    const iv = setInterval(() => {
      t--;
      const el = document.getElementById('sim-cd');
      if (el) el.textContent = t + '…';
      if (t <= 0) { clearInterval(iv); ov.remove(); done(); }
    }, 1000);
  },
  interstitial(cbOk, cbErr) {
    if (this._mock()) { this._simAd('interstitial', () => cbOk && cbOk()); return; }
    setTimeout(() => cbOk && cbOk(), 30);
  },
  showBanner() { return Promise.resolve(false); },
  hideBanner() { return Promise.resolve(false); },
  rewarded(cbReward, cbClose, cbErr) {
    // вне платформ рекламы нет: награда НЕ выдаётся, прогресс не блокируется;
    // исключение — явный debug-режим ?adsmock=1 с видимой симуляцией показа
    if (this._mock()) {
      this._simAd('rewarded', () => { cbReward && cbReward(); cbClose && cbClose(true); });
      return;
    }
    setTimeout(() => { cbErr && cbErr(); cbClose && cbClose(false); }, 30);
  },
  save(data) {
    try { this._store && this._store.setItem('sd_cloud_mock', JSON.stringify(data)); } catch (e) {}
    return Promise.resolve(true);
  },
  load() {
    try {
      const raw = this._store && this._store.getItem('sd_cloud_mock');
      return Promise.resolve(raw ? JSON.parse(raw) : null);
    } catch (e) { return Promise.resolve(null); }
  },
  getLang() {
    const n = (navigator.language || 'en').slice(0, 2).toLowerCase();
    return (n === 'ru') ? 'ru' : 'en';
  },
};

/* ============================================================
 * SPACE DASH v2 — GamePushAdapter (verified against docs.gamepush.com)
 * gp.gameStart / gp.gameplayStart / gp.gameplayStop / gp.on('pause'|'resume')
 * gp.sounds.on('mute'|'unmute'|'mute:music'|'unmute:music')
 * gp.ads.showRewardedVideo() + 'rewarded:reward'/'rewarded:close'
 * gp.ads.showFullscreen() + 'fullscreen:close'
 * gp.player.set('save', json) / get / sync / ready ; gp.language (ISO 639-1)
 * Every call guarded: the game never crashes if the SDK shape changes.
 * ============================================================ */
'use strict';

const GamePushAdapter = {
  name: 'gamepush',
  _cbs: {},
  _gp: null,
  _soundMuted: false,
  _musicMuted: false,

  _g() { return this._gp || window.gp || null; },
  _safe(fn) { try { return fn(); } catch (e) { return undefined; } },

  init() {
    const gp = this._g();
    if (!gp) return Promise.reject(new Error('no gp'));
    this._gp = gp;
    this._safe(() => gp.on('pause', () => this._emit('pause')));
    this._safe(() => gp.on('resume', () => this._emit('resume')));
    this._safe(() => {
      if (gp.sounds && gp.sounds.on) {
        gp.sounds.on('mute', () => { this._soundMuted = true; this._emit('mute'); });
        gp.sounds.on('unmute', () => { this._soundMuted = false; this._emit('unmute'); });
        gp.sounds.on('mute:music', () => { this._musicMuted = true; this._emit('mute:music'); });
        gp.sounds.on('unmute:music', () => { this._musicMuted = false; this._emit('unmute:music'); });
        this._soundMuted = !!gp.sounds.isMuted;
        this._musicMuted = !!gp.sounds.isMusicMuted;
      }
    });
    this._safe(() => {
      if (gp.ads && gp.ads.on) {
        gp.ads.on('start', () => this._emit('pause'));
        gp.ads.on('close', () => this._emit('resume'));
      }
    });
    return new Promise(resolve => {
      let done = false;
      const fin = () => { if (!done) { done = true; resolve(); } };
      this._safe(() => { if (gp.player && gp.player.ready) Promise.resolve(gp.player.ready).then(fin, fin); });
      setTimeout(fin, 4000);
    });
  },

  ready() { this._safe(() => { const gp = this._g(); gp && gp.gameStart && gp.gameStart(); }); return Promise.resolve(); },
  gameplayStart() { this._safe(() => { const gp = this._g(); gp && gp.gameplayStart && gp.gameplayStart(); }); },
  gameplayStop() { this._safe(() => { const gp = this._g(); gp && gp.gameplayStop && gp.gameplayStop(); }); },

  on(ev, cb) { (this._cbs[ev] = this._cbs[ev] || []).push(cb); },
  off(ev, cb) {
    const a = this._cbs[ev]; if (!a) return;
    const i = a.indexOf(cb); if (i >= 0) a.splice(i, 1);
  },
  _emit(ev, arg) { (this._cbs[ev] || []).slice().forEach(cb => { try { cb(arg); } catch (e) {} }); },

  showBanner() {
    const gp = this._g();
    return this._safe(() => (gp && gp.ads && gp.ads.showSticky)
      ? Promise.resolve(gp.ads.showSticky()).then(() => true, () => false)
      : Promise.resolve(false)) || Promise.resolve(false);
  },
  hideBanner() {
    const gp = this._g();
    return this._safe(() => (gp && gp.ads && gp.ads.closeSticky)
      ? Promise.resolve(gp.ads.closeSticky()).then(() => true, () => false)
      : Promise.resolve(false)) || Promise.resolve(false);
  },
  interstitial(cbOk, cbErr) {
    const gp = this._g();
    let settled = false;
    const ok = () => { if (!settled) { settled = true; cbOk && cbOk(); } };
    const err = () => { if (!settled) { settled = true; if (cbErr) cbErr(); else cbOk && cbOk(); } };
    if (!gp || !gp.ads || typeof gp.ads.showFullscreen !== 'function') return err();
    this._safe(() => {
      const p = gp.ads.showFullscreen();
      if (p && p.then) p.then(ok, err); else setTimeout(ok, 500);
    });
    setTimeout(ok, 60000);
  },

  rewarded(cbReward, cbClose, cbErr) {
    const gp = this._g();
    let rewarded = false, settled = false;
    const giveReward = () => { if (!rewarded) { rewarded = true; cbReward && cbReward(); } };
    const close = (success) => {
      if (settled) return; settled = true;
      if (!rewarded && !success) { cbErr && cbErr(); }
      cbClose && cbClose(!!success || rewarded);
    };
    if (!gp || !gp.ads || typeof gp.ads.showRewardedVideo !== 'function' || gp.ads.isRewardedAvailable === false) {
      cbErr && cbErr(); cbClose && cbClose(false); return;
    }
    this._safe(() => gp.ads.on('rewarded:reward', giveReward));
    this._safe(() => gp.ads.on('rewarded:close', close));
    this._safe(() => {
      const p = gp.ads.showRewardedVideo();
      if (p && p.then) p.then(s => { if (s) giveReward(); close(s !== false); }, () => close(false));
    });
    setTimeout(() => close(rewarded), 120000);
  },

  save(data) {
    return new Promise(resolve => {
      const gp = this._g();
      try {
        if (!gp || !gp.player || typeof gp.player.set !== 'function') return resolve(false);
        gp.player.set('save', JSON.stringify(data));
        if (typeof gp.player.sync === 'function') {
          const p = gp.player.sync();
          if (p && p.then) p.then(() => resolve(true), () => resolve(false));
          else resolve(true);
        } else resolve(true);
      } catch (e) { resolve(false); }
    });
  },

  load() {
    const gp = this._g();
    return new Promise(resolve => {
      const raw = this._safe(() => gp && gp.player && gp.player.get ? gp.player.get('save') : null);
      if (!raw) return resolve(null);
      try { resolve(typeof raw === 'string' ? JSON.parse(raw) : raw); } catch (e) { resolve(null); }
    });
  },

  getLang() {
    const gp = this._g();
    let l = this._safe(() => gp && gp.language);
    if (typeof l !== 'string') l = '';
    l = l.slice(0, 2).toLowerCase();
    return (l === 'ru' || l === 'en') ? l : 'en';
  },

  isSoundMuted() { return this._soundMuted; },
  isMusicMuted() { return this._musicMuted; },
};

/* Bootstrap: GamePush SDK if it arrives within 2 s, else LocalAdapter.

const Platform = {
  adapter: LocalAdapter,
  init() {

        if (done) return; done = true;

    if (i) {

const QUEST_DEFS = {

function ensureQuests() {
  const tk = todayKey();
  if (S.save.quests && S.save.quests.date === tk) return;
  const seed = dateSeed(tk + 'q');
  const rnd = mulberry32(seed);
  const types = Object.keys(QUEST_DEFS);
  const picked = [];
  while (picked.length < 3) {
    const ty = types[Math.floor(rnd() * types.length)];
    if (picked.indexOf(ty) === -1) picked.push(ty);
  }
  S.save.quests = {
    date: tk,
    list: picked.map((ty, i) => {
      const d = QUEST_DEFS[ty];
      const ti = Math.floor(rnd() * d.vals.length);
      return { type: ty, target: d.vals[ti], reward: d.rw[ti], prog: 0, claimed: false };
    }),
  };
  saveGame(false);
}
function updateQuests(r) {
  if (!S.save.quests || S.save.quests.date !== todayKey()) return;
  for (const q of S.save.quests.list) {
    const d = QUEST_DEFS[q.type];
    if (d) q.prog = Math.max(q.prog || 0, Math.floor(d.get(r)));
  }
}
function questStreakBump() {
  const qs = S.save.questStreak;
  const tk = todayKey();
  if (qs.last === tk) return;
  qs.days = (qs.last === yesterdayKey()) ? qs.days + 1 : 1;
  qs.last = tk;
}
function chestNext() {
  const qs = S.save.questStreak;
  for (const d of CFG.CHEST_DAYS) if (qs.days >= d && qs.chests.indexOf(d) === -1) return d;
  return 0;
}
function checkAchievements() {
  const out = [];
  for (const a of ACHS) {
    if (S.save.achievements.indexOf(a.id) !== -1) continue;
    let ok = false;
    try { ok = a.chk(S.save); } catch (e) { ok = false; }
    if (ok) { S.save.achievements.push(a.id); S.save.coins += a.reward; out.push(a); }
  }
  return out;
}

      age: 0, rot: Math.random() * 6.28, vr: (Math.random() - 0.5) * 1.4, astI: Math.floor(Math.random() * 3), passed: false, hitDone: false, ph: Math.random() * 6.28 });
  }

function updateRun(dt) {

  else if (r.od.heat > 0) { r.od.heat -= dt; odMul = 0.8; if (r.od.heat <= 0) r.od.cd = r.trait === 'reaper' ? 6 : CFG.OD_CD; }

  r.speed = Math.min(20, baseSpeed * r.ship.stats.spd * odMul) + (r.boostT > 0 ? 2 : 0);
  if (r.mod === 'fast' && r.t < 60) r.speed = Math.min(20, (CFG.SPEED_START + 2 + CFG.SPEED_RAMP * r.t) * r.ship.stats.spd * odMul);
  const dcells = r.speed * dtw;

  }
  r.shipX = clamp(r.shipX, -0.15, 2.15);

  }
  if (r.trait === 'repair' && !r.shield) { r.repairT -= dt; if (r.repairT <= 0) { r.shield = true; r.repairT = CFG.REPAIR_T / traitPow(r); toast(t('tr_repair'), 'shield'); } }
  if (r.trait === 'lucky') {

      const k = ['shield', 'magnet', 'double', 'fuel'][Math.floor(Math.random() * 4)];
      if (k === 'shield') r.shield = true;
      if (k === 'magnet') r.magnetT = CFG.MAGNET_TIME;
      if (k === 'double') r.doubleT = CFG.DOUBLE_TIME;
      if (k === 'fuel') r.fuel = Math.min(r.fuelCap, r.fuel + 20);

        if (e.type === 'blackhole') r.bhEscaped++;

        else if (e.type === 'boost') { r.boostT = 3; r.fuel = Math.max(1, r.fuel - 5); Aud.power(); toast(t('boost_pad'), 'od'); }
        else if (e.type === 'portal') {

const P = [];

function particles(x, y, n, cols, spd, life) {

    const a = Math.random() * 6.28, v = (0.3 + Math.random()) * spd * 30;
    P.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: life * (0.6 + Math.random() * 0.8), t: 0,
      size: 2 + Math.random() * 4, col: cols[Math.floor(Math.random() * cols.length)] });
  }

function floatText(x, y, txt, col) {

}
function updateFx(dt) {
  for (let i = P.length - 1; i >= 0; i--) {
    const p = P[i]; p.t += dt;
    if (p.t >= p.life) { P.splice(i, 1); continue; }
    p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.985; p.vy *= 0.985;
  }
  for (let i = FT.length - 1; i >= 0; i--) { const f = FT[i]; f.t += dt; if (f.t >= f.life) FT.splice(i, 1); }
  if (S.boomFx) { S.boomFx.t += dt; if (S.boomFx.t > 0.42) S.boomFx = null; }
  if (S.shake > 0) S.shake = Math.max(0, S.shake - dt);
  if (S.flash > 0) S.flash = Math.max(0, S.flash - dt);
  if (S.hitstop > 0) S.hitstop = Math.max(0, S.hitstop - dt);
}

/* ================= BOT ================= */
function botTick() {
  const r = S.run;
  if (!r || r.over || r.laneT < 1) return;
  const shipY = L.fieldHcells - CFG.SHIP_Y;
  if (r.laneT >= 1 && Math.abs(r.shipX - r.lane) > 0.3) { r.laneFrom = r.shipX; r.laneT = 0; }
  const look = Math.min(r.speed * 1.15, shipY + 2);
  const score = [0, 0, 0];
  for (const e of r.entities) {
    const y = r.travelled - e.dist;
    if (e.kind === 'obs') {
      const d = shipY - y;
      if (d > -0.5 && d < look) {
        const w = 1 - d / look;
        for (let l = 0; l < 3; l++) score[l] += (Math.abs(e.x - l) < 0.75 ? 1 : 0.12) * w * 3;
      }
    } else if (e.kind === 'coin') {
      const d = shipY - y;
      if (d > 0 && d < look * 1.2) for (let l = 0; l < 3; l++) score[l] -= (Math.abs(e.x - l) < 0.5 ? 0.5 : 0) * (1 - d / (look * 1.2));
    }
  }
  let best = r.lane, bs = score[r.lane];
  for (let l = 0; l < 3; l++) if (score[l] < bs - 0.15) { bs = score[l]; best = l; }
  if (best !== r.lane) moveLane(best > r.lane ? 1 : -1);
}

/* ================= INPUT ================= */
const SDin = { down: false, x0: 0, y0: 0, consumed: false };
const SD = {
  version: '2.0.0',
  booted: false,
  input: { swipes: 0, keys: 0, moves: 0, walls: 0, dropped: 0 },
  perf: { frames: 0, fps: 60, maxFrameMs: 0, genMaxMs: 0, entsMax: 0 },
  events: { runs: 0, saves: 0, pauses: 0, resumes: 0, rewarded: 0, fullscreen: 0, langSwitch: 0 },
  errors: [],
};
function moveLane(dir) {
  const r = S.run;
  if (!r || S.screen !== 'playing' || r.over) { SD.input.dropped++; return false; }
  const target = clamp(r.lane + dir, 0, 2);
  if (target === r.lane) { SD.input.walls++; return false; }
  r.laneFrom = r.shipX; r.lane = target; r.laneT = 0;
  SD.input.moves++;
  Aud.whoosh();
  return true;
}
function bindInput() {
  const el = D.cv;
  el.addEventListener('pointerdown', ev => {
    Aud.ensure(); Aud.resume();
    SDin.down = true; SDin.x0 = ev.clientX; SDin.y0 = ev.clientY; SDin.consumed = false;
    SD.input.swipes++;
  }, { passive: true });
  el.addEventListener('pointermove', ev => {
    if (!SDin.down || SDin.consumed) return;
    const dx = ev.clientX - SDin.x0, dy = ev.clientY - SDin.y0;
    if (Math.abs(dx) > 26 && Math.abs(dx) > Math.abs(dy) * 1.2) { SDin.consumed = true; moveLane(dx > 0 ? 1 : -1); }
    else if (Math.abs(dy) > 30 && Math.abs(dy) > Math.abs(dx) * 1.2) { SDin.consumed = true; if (dy < 0) overdrive(); else bomberShot(); }
  }, { passive: true });
  window.addEventListener('pointerup', () => { SDin.down = false; }, { passive: true });
  window.addEventListener('pointercancel', () => { SDin.down = false; }, { passive: true });
  window.addEventListener('keydown', ev => {
    if (ev.repeat) return;
    Aud.ensure(); Aud.resume();
    if (ev.key === 'ArrowLeft' || ev.key === 'a' || ev.key === 'A' || ev.key === 'ф' || ev.key === 'Ф') { SD.input.keys++; moveLane(-1); ev.preventDefault(); }
    else if (ev.key === 'ArrowRight' || ev.key === 'd' || ev.key === 'D' || ev.key === 'в' || ev.key === 'В') { SD.input.keys++; moveLane(1); ev.preventDefault(); }
    else if (ev.key === 'ArrowUp' || ev.key === 'w' || ev.key === 'W') { overdrive(); ev.preventDefault(); }
    else if (ev.key === 'ArrowDown' || ev.key === 's' || ev.key === 'S') { bomberShot(); ev.preventDefault(); }
    else if (ev.key === ' ' || ev.key === 'Enter') { chronoUse(); ev.preventDefault(); }
    else if (ev.key === 'Escape' || ev.key === 'p' || ev.key === 'P') { if (S.screen === 'playing') doPause('manual'); else if (S.screen === 'paused') doResume(); }
  });
  window.addEventListener('contextmenu', ev => ev.preventDefault());
  window.addEventListener('touchmove', ev => {
    const tg = ev.target;
    if (tg && tg.closest && tg.closest('.list,.obox')) return;
    if (ev.cancelable) ev.preventDefault();
  }, { passive: false });
  document.addEventListener('gesturestart', ev => ev.preventDefault());
  document.addEventListener('dblclick', ev => ev.preventDefault());
  window.addEventListener('resize', () => { layout(); if (S.screen === 'menu') fitMenu(); });
  window.addEventListener('orientationchange', () => setTimeout(layout, 120));
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) doPause('external');
    else if (S.pauseSource === 'external') doResume();
  });
  window.addEventListener('pagehide', () => saveGame(true));
  window.addEventListener('error', e => SD.errors.push('error: ' + (e.message || 'unknown')));
  window.addEventListener('unhandledrejection', e => SD.errors.push('rejection: ' + ((e.reason && e.reason.message) || 'unknown')));
}

/* ================= PAUSE / ADS ================= */
function doPause(src) {
  SD.events.pauses++;
  if (S.screen === 'playing') {
    S.screen = 'paused'; S.pauseSource = src;
    showScreen('pause');
    Aud.engineSet(0, false);
    Aud.suspend();
    try { Platform.adapter.gameplayStop(); } catch (e) {}
  } else if (src === 'external') Aud.suspend();
}
function doResume() {
  SD.events.resumes++;
  Aud.resume();
  if (S.screen === 'paused') {
    S.screen = 'playing'; S.pauseSource = null;
    showScreen('hud');
    Aud.engineStart();
    try { Platform.adapter.gameplayStart(); } catch (e) {}
  }
}
function canInterstitial() {
  const n = Date.now();
  return (n - S.sessionStart > CFG.AD_GRACE) && (n - S.lastInter > CFG.AD_COOLDOWN);
}
function showInterstitial(after) {
  if (!canInterstitial()) { after && after(); return; }
  S.lastInter = Date.now();
  SD.events.fullscreen++;
  Aud.engineSet(0, false);
  let done = false;
  const fin = () => { if (!done) { done = true; after && after(); } };
  try { Platform.adapter.interstitial(fin, fin); } catch (e) { fin(); }
}
function openAdDialog() {
  D.ad_dlg_text.textContent = t('ad_dlg_text');
  const ship = S.shipView ? shipById(S.shipView) : null;
  const canCoins = ship && ship.adShip && ship.fallbackCost && S.save.coins >= ship.fallbackCost;
  D.ad_dlg_coins.style.display = canCoins ? 'block' : 'none';
  if (canCoins) D.ad_dlg_coins.textContent = t('ad_fallback', { n: ship.fallbackCost });
  D.ad_dlg_sim.style.display = (Platform.adapter.name === 'local') ? 'block' : 'none';
  D.ad_dlg.classList.add('active');
}
function showRewarded(onReward) {
  SD.events.rewarded++;
  let granted = false;
  const grant = () => { if (!granted) { granted = true; onReward(); } };
  const deny = () => {
    openAdDialog();
  };
  try {
    Platform.adapter.rewarded(grant, () => {}, deny);
  } catch (e) { deny(); }
}

/* ================= RENDER ================= */
let lastTs = 0, fpsAcc = 0, fpsN = 0, pulseT = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  const t0 = performance.now();
  if (!lastTs) lastTs = ts;
  let dt = (ts - lastTs) / 1000;
  lastTs = ts;
  if (dt > 0.05) dt = 0.05;
  if (dt <= 0) dt = 1 / 60;
  SD.perf.frames++;
  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.5) { SD.perf.fps = Math.round(fpsN / fpsAcc); fpsAcc = 0; fpsN = 0; }

  if (S.screen === 'playing' && S.hitstop <= 0) {
    S.playedMs += dt * 1000;
    updateRun(dt);
  }
  updateFx(dt);
  updateStars(dt);
  render();
  if (S.screen === 'playing' || S.screen === 'paused') updateHud();
  const ms = performance.now() - t0;
  if (SD.perf.frames > 120 && ms > SD.perf.maxFrameMs) SD.perf.maxFrameMs = ms;  // steady-state metric
}
function updateStars(dt) {
  const r = S.run;
  const spd = (S.screen === 'playing' && r && !r.over) ? r.speed : 3;
  deepOff = (deepOff + spd * 0.05 * L.cell * dt * 0.55) % Math.max(1, L.ch);
  for (const d of dust) {
    d.y += spd * 1.5 * L.cell * dt * 0.55;
    if (d.y > L.ch + 20) { d.y = -20; d.x = Math.floor(Math.random() * L.cw); }
  }
  S.shootAt -= dt;
  if (!S.shootStar && S.shootAt <= 0) {
    S.shootStar = { x: Math.random() * L.cw, y: -20, vx: 260 + Math.random() * 200, vy: 420 + Math.random() * 240, t: 0 };
    S.shootAt = 5 + Math.random() * 7;
  }
  if (S.shootStar) {
    const s = S.shootStar; s.t += dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.t > 0.9 || s.y > L.ch + 40) S.shootStar = null;
  }
  pulseT += dt;
}
function render() {
  const g = D.cv_ctx;
  g.setTransform(L.dpr, 0, 0, L.dpr, 0, 0);
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, L.cw, L.ch);
  if (L.bg) g.drawImage(L.bg, 0, 0);
  if (L.deep) { const oy = Math.floor(deepOff); g.drawImage(L.deep, 0, oy); g.drawImage(L.deep, 0, oy - L.ch); }
  for (const d of dust) {
    g.fillStyle = d.a ? 'rgba(190,215,255,.20)' : 'rgba(190,215,255,.12)';
    g.fillRect(d.x, Math.floor(d.y), 1, 3);
  }
  if (S.shootStar) {
    const s2 = S.shootStar;
    g.fillStyle = '#e8f2ff';
    for (let i = 0; i < 5; i++) g.fillRect(Math.floor(s2.x - i * 3), Math.floor(s2.y - i * 4), 2, 2);
  }
  let ox = 0, oy2 = 0;
  if (S.shake > 0) {
    ox = Math.round((Math.random() - 0.5) * S.shakeMag * S.shake * 2);
    oy2 = Math.round((Math.random() - 0.5) * S.shakeMag * S.shake * 2);
  }
  g.save(); g.translate(ox, oy2);
  const fx = L.fieldX, fw = L.fieldW, cell = L.cell;
  if (L.rail) g.drawImage(L.rail, fx - 8, 0);
  if (L.pulse) {
    const gap = 240;
    for (let k = 0; k < 2; k++) {
      const ex = fx + (k ? fw - 4 : 0);
      for (let py = (pulseT * 260) % gap - gap; py < L.ch; py += gap) g.drawImage(L.pulse, Math.floor(ex) + 1, Math.floor(py));
    }
  }
  const r = S.run;
  const playing = (S.screen === 'playing' || S.screen === 'paused' || S.screen === 'gameover') && r;
  if (playing) {
    const off = Math.floor((r.travelled * cell) % 30);
    g.fillStyle = '#1c2547';
    for (let i = 1; i < 3; i++) for (let y = -off; y < L.ch; y += 30) g.fillRect(fx + Math.floor(i * cell) - 1, y, 2, 12);
    if (r.storm > 0) {
      g.fillStyle = 'rgba(255,64,48,' + (0.05 + 0.04 * Math.sin(r.t * 10)).toFixed(3) + ')';
      g.fillRect(fx - 8, 0, fw + 16, L.ch);
    }
    if (r.bonusT > 0) {
      g.fillStyle = 'rgba(120,90,255,.07)';
      g.fillRect(fx - 8, 0, fw + 16, L.ch);
    }
    if (r.od.t > 0) {
      g.fillStyle = 'rgba(255,190,70,.06)';
      g.fillRect(fx - 8, 0, fw + 16, L.ch);
    }
    if (r.speed > 9) {
      g.fillStyle = 'rgba(200,225,255,.28)';
      for (let i = 0; i < 7; i++) {
        const sx2 = fx + ((i * 97 + Math.floor(r.travelled * 5) * 31) % fw);
        const sy2 = ((i * 211 + r.travelled * cell * 2.2) % (L.ch + 120)) - 60;
        g.fillRect(Math.floor(sx2), Math.floor(sy2), 1, 26 + r.speed * 2);
      }
    }
    const shipY = (L.fieldHcells - CFG.SHIP_Y) * cell;
    if (r.trait === 'scout') {
      g.globalAlpha = 0.26;
      for (const e of r.entities) {
        if (e.kind !== 'obs') continue;
        const y = (r.travelled - e.dist) * cell;
        if (y < -cell * 9 || y >= -cell * 1.8) continue;
        const x = fx + (e.x + 0.5) * cell;
        const sp = baked('ast' + (e.astI || 0), LOW.ast[e.astI || 0]);
        g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2));
      }
      g.globalAlpha = 1;
    }
    for (const e of r.entities) {
      const y = (r.travelled - e.dist) * cell;
      if (y < -cell * 1.8 || y > L.ch + cell * 1.8) continue;
      const x = fx + (e.x + 0.5) * cell;
      if (e.kind === 'obs') {
        if (e.type === 'asteroid') {
          const sp = baked('ast' + e.astI, LOW.ast[e.astI]);
          g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2));
        } else if (e.type === 'pillar') {
          const sp = baked('pillar', LOW.pillar);
          g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2));
        } else if (e.type === 'debris') {
          const sp = baked('deb', LOW.debris);
          const bob = Math.floor(Math.sin(e.age * 3) * 2);
          g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2) + bob);
          if (Math.random() < 0.18) particles(x, y, 1, ['#ffd76a'], 1, 0.25);
        } else {
          const fr = Math.floor(r.t * 6 + e.ph) % 2;
          const sp = baked('hole' + fr, LOW.hole[fr], 2);
          g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2));
        }
      } else if (e.kind === 'coin') {
        const fr = Math.floor(r.t * 8 + e.ph) % 4;
        const sp = baked('coin' + fr, LOW.coin[fr]);
        g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(y - sp.height / 2));
      } else {
        const low = e.type === 'fuel' ? LOW.fuel : e.type === 'shield' ? LOW.shield : e.type === 'magnet' ? LOW.magnet : e.type === 'double' ? LOW.double : e.type === 'boost' ? LOW.boost : e.type === 'portal' ? LOW.portal : LOW.trader;
        const sp = baked('it' + e.type, low);
        const yy = y + Math.sin(r.t * 4 + (e.ph || 0)) * 2;
        g.drawImage(sp, Math.floor(x - sp.width / 2), Math.floor(yy - sp.height / 2));
      }
    }
    if (r.magnetT > 0) {
      g.fillStyle = 'rgba(158,240,255,.5)';
      const cx = fx + (r.shipX + 0.5) * cell;
      const rr2 = CFG.MAGNET_R * cell;
      for (let a = 0; a < 40; a++) {
        const ang = a / 40 * 6.28 + r.t;
        g.fillRect(Math.floor(cx + Math.cos(ang) * rr2), Math.floor(shipY + Math.sin(ang) * rr2), 2, 2);
      }
    }
    if (S.screen !== 'gameover' || r.reason === 'fuel') {
      const sx = fx + (r.shipX + 0.5) * cell;
      const blink = r.invulnT > 0 && Math.floor(r.t * 12) % 2 === 0;
      if (r.phaseT > 0) g.globalAlpha = 0.45;
      const sp = baked('ship' + r.ship.id, LOW.ships[(r.ship.id - 1) % LOW.ships.length]);
      const ff = Math.floor(r.t * 24) % 3;
      const fl = baked('flame' + ff, LOW.flame[ff]);
      g.save();
      g.translate(Math.floor(sx), Math.floor(shipY));
      const tilt = clamp((r.lane - r.shipX) * 0.35, -0.3, 0.3);
      if (tilt) g.rotate(tilt);
      if (blink) g.globalAlpha = 0.4;
      g.drawImage(fl, -Math.floor(fl.width / 2), Math.floor(sp.height / 2) - 2 * PS);
      g.drawImage(sp, -Math.floor(sp.width / 2), -Math.floor(sp.height / 2));
      g.globalAlpha = 1;
      g.restore();
      if (r.trait === 'escort') {
        const dxp = fx + (clamp(r.lane + r.droneSide, 0, 2) + 0.5) * cell;
        const dp = baked('drone', LOW.drone);
        g.drawImage(dp, Math.floor(dxp - dp.width / 2), Math.floor(shipY - cell * 0.9 - dp.height / 2 + Math.sin(r.t * 5) * 2));
      }
      if (r.shield) {
        g.strokeStyle = 'rgba(126,220,255,.85)'; g.lineWidth = 2;
        g.setLineDash([6, 6]); g.lineDashOffset = -r.t * 30;
        g.beginPath(); g.arc(Math.floor(sx), Math.floor(shipY), cell * 0.62, 0, 7); g.stroke();
        g.setLineDash([]);
      }
    }
    if (S.boomFx) {
      const bf = S.boomFx;
      const fr = Math.min(2, Math.floor(bf.t * 14));
      const sp = baked('boom' + fr, LOW.boom[fr], 2);
      g.drawImage(sp, Math.floor(bf.x - sp.width / 2), Math.floor(bf.y - sp.height / 2));
    }
  }
  for (const p of P) {
    const a = 1 - p.t / p.life;
    g.globalAlpha = a;
    g.fillStyle = p.col;
    const sz = Math.max(2, Math.round(p.size * a));
    g.fillRect(Math.floor(p.x + ox), Math.floor(p.y + oy2), sz, sz);
  }
  g.globalAlpha = 1;
  for (const f of FT) {
    const a = 1 - f.t / f.life;
    g.globalAlpha = a;
    g.fillStyle = f.col;
    g.font = '900 15px system-ui, sans-serif'; g.textAlign = 'center';
    g.fillText(f.txt, Math.floor(f.x), Math.floor(f.y - f.t * 42));
  }
  g.globalAlpha = 1;
  g.restore();
  if (S.flash > 0) { g.fillStyle = 'rgba(220,240,255,' + (S.flash * 1.1).toFixed(3) + ')'; g.fillRect(0, 0, L.cw, L.ch); }
  if (playing && r.fuel < 25 && S.screen === 'playing') {
    const a = 0.10 + Math.sin(performance.now() / 200) * 0.06;
    g.fillStyle = 'rgba(224,80,60,' + Math.max(0, a).toFixed(3) + ')';
    for (let y = 0; y < L.ch; y += 4) g.fillRect(0, y, L.cw, 1);
  }
}

/* ================= HUD ================= */
let hudCache = { d: -1, c: -1, f: -1, s: -1, pu: '', sk: null };
function updateHud() {
  const r = S.run;
  if (!r) return;
  const dm = Math.floor(r.dist_m);
  if (dm !== hudCache.d) { D.hud_dist.textContent = t('distance_m', { n: dm }); hudCache.d = dm; }
  if (r.coins !== hudCache.c) { D.hud_coins.innerHTML = pixIconSVG('coin', 14) + ' ' + r.coins; hudCache.c = r.coins; }
  const fp = Math.round(r.fuel / r.fuelCap * 100);
  if (fp !== hudCache.f) {
    D.hud_fuel.style.width = fp + '%';
    D.hud_fuel.classList.toggle('low', r.fuel < 25);
    hudCache.f = fp;
  }
  const sp = Math.round((Math.min(CFG.SPEED_MAX, r.speed) - CFG.SPEED_START) / (CFG.SPEED_MAX - CFG.SPEED_START) * 100);
  if (sp !== hudCache.s) { D.hud_speed.style.width = sp + '%'; hudCache.s = sp; }
  let pu = '';
  if (r.shield) pu += '<span class="pu-chip shield">' + pixIconSVG('shield', 12) + ' ' + t('pu_shield') + '</span>';
  if (r.magnetT > 0) pu += '<span class="pu-chip magnet">' + pixIconSVG('magnet', 12) + ' ' + Math.ceil(r.magnetT) + 's</span>';
  if (r.doubleT > 0) pu += '<span class="pu-chip double">' + pixIconSVG('star', 12) + ' ×2 ' + Math.ceil(r.doubleT) + 's</span>';
  if (r.combo >= 3) pu += '<span class="pu-chip combo">' + pixIconSVG('flame', 12) + ' ' + t('combo', { n: r.combo }) + '</span>';
  if (r.storm > 0) pu += '<span class="pu-chip storm">' + pixIconSVG('flame', 12) + ' ' + t('storm_now') + '</span>';
  if (pu !== hudCache.pu) { D.pu_chips.innerHTML = pu; hudCache.pu = pu; }
  const sb = D.skill_bar;
  if (sb) {
    let html = '';
    const odReady = r.od.t <= 0 && r.od.heat <= 0 && r.od.cd <= 0;

      '<em>' + (r.od.t > 0 ? t('od_active') : r.od.heat > 0 ? t('od_heat') : r.od.cd > 0 ? t('od_cd') : t('od_ready')) + '</em></button>';
    if (r.trait === 'bomber') html += '<button id="sk-bomb" class="sk' + (r.bombs > 0 ? '' : ' off') + '">' + pixIconSVG('bomb', 18) + '<em>' + t('skill_bomb', { n: r.bombs }) + '</em></button>';
    if (r.trait === 'chrono') html += '<button id="sk-chrono" class="sk' + (r.chronoUsed ? ' off' : '') + '">' + pixIconSVG('clock', 18) + '<em>' + t('skill_chrono') + '</em></button>';
    if (html !== hudCache.sk) {
      sb.innerHTML = html; hudCache.sk = html;
      const b1 = document.getElementById('sk-od'); if (b1) b1.addEventListener('click', ev => { ev.stopPropagation(); overdrive(); });
      const b2 = document.getElementById('sk-bomb'); if (b2) b2.addEventListener('click', ev => { ev.stopPropagation(); bomberShot(); });
      const b3 = document.getElementById('sk-chrono'); if (b3) b3.addEventListener('click', ev => { ev.stopPropagation(); chronoUse(); });
    }
  }
}

/* ================= SCREENS / UI ================= */
function showScreen(name) {
  if (name !== 'hud') D.tut.classList.remove('active');
  for (const el of document.querySelectorAll('.screen')) el.classList.remove('active');
  D.scr_pause.classList.remove('active');
  D.scr_over.classList.remove('active');
  D.scr_ship.classList.remove('active');
  D.ad_dlg.classList.remove('active');
  D.hud.classList.remove('active');
  if (name === 'hud') D.hud.classList.add('active');
  else if (name === 'pause') { D.hud.classList.add('active'); D.scr_pause.classList.add('active'); }
  else if (name === 'over') D.scr_over.classList.add('active');
  else { const el = D['scr_' + name]; if (el) el.classList.add('active'); }
  S.screen = name === 'hud' ? 'playing' : (name === 'pause' ? 'paused' : (name === 'over' ? 'gameover' : name));
  if (name === 'menu') { S.run = null; syncCoinsUI(); renderMenu(); fitMenu(); }
  if (name === 'missions') renderMissions();
  if (name === 'ships') renderShips();
  if (name === 'ach') renderAchs();
  if (name === 'daily') renderDaily();
  if (name === 'set') renderSettings();
}
function fitMenu() {
  const scr = D.scr_menu;
  if (!scr) return;
  const panel = scr.querySelector('.panel');
  if (!panel) return;
  panel.style.transform = '';
  scr.classList.remove('fit-scaled');
  requestAnimationFrame(() => {
    const avail = scr.clientHeight - 8;
    const need = panel.scrollHeight;
    if (need > avail && avail > 0) {
      const k = Math.max(0.55, avail / need);
      panel.style.transform = 'scale(' + k.toFixed(3) + ')';
      scr.classList.add('fit-scaled');
    }
  });
}
function syncCoinsUI() {

function toast(msg, icon) {
  const el = document.createElement('div');
  el.className = 'toast';
  if (icon) el.innerHTML = pixIconSVG(icon, 14) + ' ';
  el.appendChild(document.createTextNode(msg));
  D.toast_box.appendChild(el);
  setTimeout(() => { el.style.transition = 'opacity .4s'; el.style.opacity = '0'; setTimeout(() => el.remove(), 420); }, 2600);
  while (D.toast_box.children.length > 4) D.toast_box.firstChild.remove();
}
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function renderMissions() {
  const box = D.missions_list;
  box.textContent = '';
  for (const m of MISSIONS) {
    const done = S.save.missions_completed.indexOf(m.id) !== -1;
    const best = S.save.mission_best[m.id] || 0;
    const prog = Math.min(1, (m.type === 'perfect' ? (best >= m.target ? 1 : 0) : best / m.target));
    const card = document.createElement('div');
    card.className = 'card' + (done ? ' done' : '');
    card.innerHTML = '<div class="cbody"><div class="cname">' + esc(t('m_' + m.type, { n: m.target })) + '</div>' +
      '<div class="csub">' + t('mission_reward', { n: m.reward }) + (done ? ' · ' + t('mission_completed') : ' · ' + Math.floor(best) + '/' + m.target) + '</div>' +
      '<div class="pbar"><i style="width:' + Math.round((done ? 1 : prog) * 100) + '%"></i></div></div>';
    const btn = document.createElement('button');
    btn.className = 'btn small ' + (done ? 'gray' : 'gold');
    btn.textContent = done ? '✔' : t('mission_play');
    if (!done) btn.addEventListener('click', () => { Aud.ui(); startRun('mission', { missionId: m.id }); });
    card.appendChild(btn);
    box.appendChild(card);
  }
  syncCoinsUI();
}
function renderShips() {
  const grid = D.ships_grid;
  grid.textContent = '';

  for (const ship of SHIPS) {
    const avail = isShipAvailable(ship.id);
    const equipped = S.save.ship_equipped === ship.id && avail;
    const card = document.createElement('div');
    card.className = 'shipcard' + (equipped ? ' sel' : '') + (avail ? '' : ' locked');

    img.width = 64; img.height = 68; img.className = 'shipimg';

    ig.drawImage(low, 0, 0, low.width, low.height, 0, 0, 64, 68);
    card.appendChild(img);
    const body = document.createElement('div'); body.className = 'sbody';
    const nm = document.createElement('div'); nm.className = 'sn'; nm.textContent = t(ship.nameKey);
    body.appendChild(nm);
    const stz = masteryStars(ship.id);
    const trl = document.createElement('div'); trl.className = 'tr';
    trl.innerHTML = '<span class="stars">' + '★'.repeat(stz) + '☆'.repeat(3 - stz) + '</span> ' + esc(t('tr_' + (ship.trait || 'stock')));
    body.appendChild(trl);

      card.appendChild(cost);

function offerRent(ship) {
  if (S.save.coins >= ship.cost) {
    S.save.coins -= ship.cost;
    S.save.ships_unlocked.push(ship.id);
    S.save.ship_equipped = ship.id;
    checkAchievements(); saveGame(true); Aud.win();
    toast(t(ship.nameKey), 'star');
    renderShips();
    return;
  }
  showRewarded(() => {
    S.save.ship_rented = { id: ship.id, date: todayKey() };
    S.save.ship_equipped = ship.id;
    saveGame(true);
    toast(t('rented'), 'star');
    renderShips();
  });
}
function openShipDetail(id) {
  const ship = shipById(id);
  S.shipView = id;
  const avail = isShipAvailable(id);
  const stars = masteryStars(id);
  const m = S.save.mastery[id] || { d: 0, c: 0, s: 0 };
  const g = D.sd_sprite.getContext('2d');
  g.imageSmoothingEnabled = false;
  g.clearRect(0, 0, 120, 128);

  D.sd_trait.textContent = t('trait_label') + ': ' + t('tr_' + (ship.trait || 'stock'));
  D.sd_desc.textContent = t('tr_' + (ship.trait || 'stock') + 'd');
  const st = ship.stats;
  D.sd_stats.innerHTML =
    '<div class="st"><span>' + esc(t('st_speed')) + '</span><b>×' + st.spd.toFixed(2) + '</b></div>' +
    '<div class="st"><span>' + esc(t('st_fuel')) + '</span><b>' + (120 + st.fuel) + ' s' + (st.fuel ? ' (+' + st.fuel + ')' : '') + '</b></div>' +
    '<div class="st"><span>' + esc(t('st_mag')) + '</span><b>×' + st.mag.toFixed(1) + '</b></div>' +
    '<div class="st"><span>' + esc(t('st_coin')) + '</span><b>×' + st.coin + '</b></div>';
  const goals = [
    { txt: t('mast1'), cur: m.d || 0, tgt: 500, done: stars >= 1, fmt: v => Math.min(v, 500) + ' m' },
    { txt: t('mast2'), cur: m.c || 0, tgt: 150, done: stars >= 2, fmt: v => Math.min(v, 150) + ' 🪙'.replace('🪙', '') },
    { txt: t('mast3'), cur: m.s || 0, tgt: 2, done: stars >= 3, fmt: v => Math.min(v, 2) + '/2' },
  ];
  D.sd_mast.innerHTML = '<div class="mrow"><span style="color:#cfe0ff;font-weight:900">' + esc(t('sd_progress')) + '</span></div>' +
    goals.map(gl => '<div class="mrow' + (gl.done ? ' done' : '') + '"><span>' + (gl.done ? '✔ ' : '· ') + esc(gl.txt) + '</span><span class="mv">' + gl.fmt(gl.cur) + '</span></div>').join('');
  const equipped = S.save.ship_equipped === id && avail;
  D.sd_equip.style.display = avail ? 'block' : 'none';
  D.sd_equip.textContent = equipped ? t('equipped') : t('equip');
  D.sd_equip.disabled = equipped;
  D.sd_equip.className = 'btn ' + (equipped ? 'gray' : 'green');
  if (ship.adShip && S.adsReal) {
    const need = ship.adNeed || 3;
    const n = Math.min(need, S.save.ad_progress[ship.id] || 0);
    D.sd_ad.style.display = 'block';
    D.sd_ad.innerHTML = n >= need ? t('ad_ship_done', { n: need, m: need }) : pixIconSVG('od', 14) + ' ' + t('ad_ship_btn', { n: n, m: need });
    D.sd_ad.disabled = false;
  } else D.sd_ad.style.display = 'none';
  if (ship.adShip && !S.adsReal) {
    D.sd_adnote.style.display = 'block';
    D.sd_adnote.textContent = t('ad_noenv');
  } else D.sd_adnote.style.display = 'none';
  const showBuy = !avail && (!ship.adShip || !!ship.fallbackCost);
  D.sd_buy.style.display = showBuy ? 'block' : 'none';
  D.sd_buy.innerHTML = (ship.adShip ? esc(t('ad_fallback', { n: ship.fallbackCost })) + ' ' : '') + pixIconSVG('coin', 12) + ' ' + (ship.adShip ? ship.fallbackCost : ship.cost) +
    (ship.ach ? ' · ' + esc(t('locked_ach', { name: t(ship.ach) })) : '') +
    (ship.reqShips ? ' · ' + S.save.ships_unlocked.length + '/' + ship.reqShips : '');
  D.scr_ship.classList.add('active');
}
